name: Build Debug APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: "21"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build debug APK
        continue-on-error: true
        run: ./gradlew :example:android:assembleDebug 2>&1 | tee build.log
      - name: Collect output
        run: |
          mkdir -p out
          if ls example/android/build/outputs/apk/debug/*.apk >/dev/null 2>&1; then
            cp $(ls example/android/build/outputs/apk/debug/*.apk | head -1) out/Miuix-debug.apk
          fi
          cp build.log out/build.log || true
          ls -la out
      - name: Publish to draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-apk-2
          name: Miuix Debug APK (crash fix)
          draft: true
          files: |
            out/Miuix-debug.apk
            out/build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
