name: Ktlint Diagnostic

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Run spotlessCheck
        continue-on-error: true
        run: ./gradlew spotlessCheck 2>&1 | tee spotless.log
      - name: Report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('spotless.log', 'utf8'); } catch (e) { log = '(no log)'; }
            log = log.slice(-50000);
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'spotlessCheck output:\n\n```\n' + log + '\n```'
            });
